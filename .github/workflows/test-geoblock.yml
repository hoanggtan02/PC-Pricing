name: Test geo-block (manual, no DB, no proxy)

on:
  workflow_dispatch:   

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Force apt to use IPv4 (fix hanging on archive.ubuntu.com)
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::Retries "3";' | sudo tee -a /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99force-ipv4

      - name: Install Playwright
        # Trước đây KHÔNG có timeout-minutes — nếu apt treo, step ăn hết timeout mặc định của cả
        # job (nhiều giờ) trước khi fail. Chốt an toàn thấp hơn, fail rõ ràng trong vài phút.
        timeout-minutes: 10
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test Phong Vu (direct, no proxy)
        run: python test_geoblock_direct.py phongvu
      - name: Test FPT Shop (direct, no proxy)
        run: python test_geoblock_direct.py fptshop
        if: always()
      - name: Upload evidence (screenshots/html)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: geoblock-evidence
          path: scraper/*.png
          if-no-files-found: ignore