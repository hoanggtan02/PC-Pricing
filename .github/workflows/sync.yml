name: Daily price sync (Mode B - Link crawl)
# ─────────────────────────────────────────────────────────────────────────────
# Mode B: Đồng bộ giá theo link trực tiếp từ DB — NHANH, tiết kiệm tài nguyên.
# Chạy MỖI NGÀY (kể cả cuối tuần). Không khám phá SP mới, chỉ cập nhật giá
# cho các SKU đã có trong sources. URL thủ công (is_manual_url=true) được bảo vệ.
#
# Mỗi CỬA HÀNG chạy trong MỘT job riêng (matrix), SONG SONG với nhau — nhanh hơn (không còn 9
# competitor dồn chung CONCURRENCY_LIMIT=5 worker của một process) và log tách rõ theo từng shop
# thay vì lẫn lộn trong một job dài.
#
# `summary` gom danh sách link cào lỗi (competitor/sku/url/reason) của TẤT CẢ job lại thành một
# báo cáo duy nhất — chạy dù có job nào lỗi (if: always()).
# `refresh` làm mới cache latest_prices_cache CHỈ MỘT LẦN, sau khi mọi job sync xong.
#
# FIX (2026-08): job hay bị TREO VÔ THỜI HẠN ở bước "Install dependencies", kẹt ở dòng
# "Get:5 https://archive.ubuntu.com/ubuntu noble-security InRelease" — apt-get bên trong
# `playwright install --with-deps` cố kết nối archive.ubuntu.com/security.ubuntu.com qua IPv6,
# route IPv6 của runner chập chờn nên TREO thay vì fail/timeout. Sửa bằng 2 việc:
#   1. Ép apt dùng IPv4 (Acquire::ForceIPv4) TRƯỚC khi cài — fix chính cho đúng triệu chứng này.
#   2. Thêm timeout-minutes cho step cài đặt — nếu vẫn dính sự cố mirror, step FAIL trong vài
#      phút thay vì "đứng" hàng giờ chiếm slot chạy song song (9 job matrix theo cửa hàng).
#
# FIX #2 (bổ sung sau, cùng triệu chứng khác nguyên nhân): "ForceIPv4" chỉ chặn lỗi KHÔNG KẾT
# NỐI ĐƯỢC (route IPv6 chết → treo ngay từ đầu). Có một lớp lỗi KHÁC: kết nối TCP/TLS đã mở
# thành công (log in ra "Get:5 ... InRelease [126 kB]" — apt đã biết trước dung lượng file) nhưng
# quá trình TẢI bị NGHẼN GIỮA CHỪNG (server security.ubuntu.com — endpoint bảo mật dùng chung
# toàn cầu, không có mirror khu vực nhanh như archive.ubuntu.com — bị quá tải/rate-limit). apt
# KHÔNG có timeout mặc định cho một kết nối "còn sống nhưng gần như không chảy dữ liệu", nên nó
# chờ vô thời hạn dù Acquire::Retries đã đặt (Retries chỉ kích hoạt khi apt NHẬN được lỗi, không
# giúp gì với một tải bị treo im lặng). Thêm Acquire::http::Timeout / Acquire::https::Timeout để
# ép apt tự huỷ một kết nối treo sau 15s, để Retries có cơ hội thử lại thay vì đứng tới khi chạm
# timeout-minutes của cả step.
#
# FIX #3 (2026-08, bổ sung): step vẫn thỉnh thoảng chạm hết timeout-minutes=10 dù đã có 2 fix
# trên (khi nhiều job matrix chạy song song, mirror apt/pip có lúc chậm hơn 10 phút chứ không hẳn
# treo im lặng). Nâng lên 30 phút — vẫn thấp hơn nhiều so với trần cứng 6h/job của GitHub-hosted
# runner, đủ để chịu được các đợt mirror chậm mà không cần re-run tay liên tục.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Run 1: 01:00 VN (18:00 UTC hôm trước) → xong ~02:00 VN
    - cron: "0 18 * * *"
    # Run 2: 13:00 VN (06:00 UTC) → xong ~14:00 VN
    - cron: "0 6 * * *"
  workflow_dispatch:

# Chỉ 1 lần chạy tại một thời điểm (tránh đụng Supabase)
concurrency:
  group: daily-price-sync
  cancel-in-progress: false

jobs:
  # ── Mỗi leg = một cửa hàng. `id` dùng làm tên file/artifact (không dấu, không khoảng trắng);
  # `competitor` là giá trị THẬT lưu trong DB (cột competitors.name / sources.competitor).
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # một shop lỗi không huỷ các shop khác
      matrix:
        include:
          - { id: tnc,         competitor: "Thành Nhân" }
          - { id: cellphones,  competitor: "CellphoneS" }
          - { id: anphat,      competitor: "An Phát PC" }
          - { id: hacom,       competitor: "Hà Nội Computer" }
          - { id: gearvn,      competitor: "GearVN" }
          - { id: memoryzone,  competitor: "Memoryzone" }
          - { id: phongvu,     competitor: "Phong Vũ" }
          - { id: fptshop,     competitor: "FPT Shop" }
          - { id: tgdd,        competitor: "Thế Giới Di Động" }
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Cache trình duyệt Chromium — 9 job song song tự tải lại chromium sẽ tốn băng thông lặp lại
      # vô ích. Cache theo hash requirements.txt.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      # FIX: apt-get bên trong "playwright install --with-deps" hay TREO VÔ THỜI HẠN.
      # Nguyên nhân 1 (đã sửa): kết nối archive.ubuntu.com/security.ubuntu.com qua IPv6 route
      # chập chờn của runner → không kết nối được ngay từ đầu. Ép ForceIPv4 để tránh.
      # Nguyên nhân 2 (bổ sung — xem ghi chú FIX #2 ở đầu file): kết nối TCP/TLS mở được nhưng
      # TẢI BỊ NGHẼN GIỮA CHỪNG ở security.ubuntu.com (endpoint bảo mật dùng chung toàn cầu, dễ
      # quá tải hơn mirror archive.ubuntu.com). apt không có timeout mặc định cho ca này nên chờ
      # vô thời hạn — thêm Acquire::http::Timeout / Acquire::https::Timeout để tự huỷ sau 15s và
      # để Acquire::Retries có cơ hội thử lại.
      - name: Force apt to use IPv4 (fix hanging on archive.ubuntu.com)
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::Retries "3";' | sudo tee -a /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99force-ipv4

      - name: Install dependencies
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sync prices - ${{ matrix.competitor }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: |
          echo "::group::Mode B - Sync prices (${{ matrix.competitor }})"
          python -m scraper.sync_prices \
            --competitor "${{ matrix.competitor }}" \
            --skip-refresh \
            --failures-file "$RUNNER_TEMP/failures-${{ matrix.id }}.tsv"
          echo "::endgroup::"

      # Upload dù job lỗi (if: always()) — job `summary` cần dữ liệu này để tổng hợp. File trống
      # (không lỗi) vẫn được upload bình thường; if-no-files-found: ignore chỉ để phòng script
      # crash trước khi kịp ghi file.
      - name: Upload failure log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: failures-${{ matrix.id }}
          path: ${{ runner.temp }}/failures-${{ matrix.id }}.tsv
          if-no-files-found: ignore
          retention-days: 7

  # ── Gom log lỗi (link cào lỗi) của TẤT CẢ 9 job lại thành MỘT báo cáo duy nhất. Chạy dù có job
  # sync nào lỗi/timeout (if: always()) — để không mất báo cáo của các job đã chạy xong.
  summary:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all failure logs
        uses: actions/download-artifact@v4
        with:
          pattern: "failures-*"
          path: /tmp/failures
          merge-multiple: true

      - name: Aggregate failed scrape links
        run: |
          ALL=/tmp/all_failures.tsv
          : > "$ALL"
          # Gộp mọi file *.tsv, bỏ dòng header lặp lại (mỗi file con đều có header riêng).
          for f in /tmp/failures/*.tsv; do
            [ -f "$f" ] || continue
            tail -n +2 "$f" >> "$ALL"
          done

          TOTAL=$(wc -l < "$ALL" | tr -d ' ')

          echo "::group::❌ Tổng hợp link cào lỗi (toàn bộ 9 cửa hàng)"
          echo "Tổng số link lỗi: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            echo ""
            echo "== Số lỗi theo cửa hàng =="
            awk -F'\t' '{c[$1]++} END{for (k in c) print c[k]"\t"k}' "$ALL" \
              | sort -rn | awk -F'\t' '{printf "%6s  %s\n",$1,$2}'
            echo ""
            echo "== Số lỗi theo loại (reason) =="
            awk -F'\t' '{print $4}' "$ALL" | sed -E 's/^\[([A-ZÀ-Ỹ\/ ]+)\].*/[\1]/' \
              | sort | uniq -c | sort -rn
            echo ""
            echo "== Chi tiết (competitor · sku · reason · url) =="
            awk -F'\t' '{printf "- [%s] %s: %s  (%s)\n",$1,$2,$4,$3}' "$ALL"
          else
            echo "Không có link nào cào lỗi trong lượt chạy này 🎉"
          fi
          echo "::endgroup::"

          # Ghi thêm vào Job Summary của GitHub Actions để xem ngay trên tab Summary, không cần
          # mở log chi tiết.
          {
            echo "## ❌ Link cào lỗi (Daily price sync)"
            echo ""
            echo "Tổng số: **$TOTAL**"
            echo ""
            if [ "$TOTAL" -gt 0 ]; then
              echo "| Cửa hàng | SKU | Lý do | URL |"
              echo "|---|---|---|---|"
              awk -F'\t' '{printf "| %s | %s | %s | %s |\n",$1,$2,$4,$3}' "$ALL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── latest_prices_cache là ẢNH CHỤP — phải refresh sau khi TẤT CẢ job sync xong. Chạy MỘT LẦN
  # DUY NHẤT ở đây (không phải mỗi job tự refresh — vừa thừa vừa dễ đụng race). if: always() để
  # refresh cả khi chỉ có source bị tắt vì hàng cũ/demo ở một vài job (không có giá mới thành
  # công) — nếu chỉ refresh khi mọi job sync đều success, giá cũ vẫn kẹt trong snapshot.
  refresh:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          echo "::group::pip install"
          pip install -r requirements.txt
          echo "::endgroup::"

      - name: Refresh latest_prices cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scraper.refresh_views