  # ── Thiết bị mạng (Tier A: router/switch/AP đều có mã model in giống nhau mọi cửa hàng) ──
  # Router (gộp: wifi gia đình + doanh nghiệp) — một search_term "router" phủ cả hai bên đối thủ;
  # phía TNC quét CẢ HAI trang catalog (wireless + router-doanh-nghiep) qua danh sách `tnc`.
  router:
    tier: A
    search_term: "router"
    name_match: "router|bộ phát|bo phat|\\bwifi\\b|wi-fi|firewall|gateway|balance|vigor|edgerouter"
    name_exclude: "^laptop|switch|access point|repeater|card wifi|usb wifi|anten|dây|cáp|cap "
    tnc:
      - "https://www.tnc.com.vn/wireless.html?p={page}"
      - "https://www.tnc.com.vn/router-doanh-nghiep.html?p={page}"
    paths:
      phongvu: "https://phongvu.vn/c/thiet-bi-mang-an-ninh"
      tgdd:    "https://www.thegioididong.com/thiet-bi-mang"
      fptshop: "https://fptshop.com.vn/tim-kiem?tab=kham-pha&s=router&page={page}"
      phucanh: "https://www.phucanh.vn/thiet-bi-mang.html"
      vuhoang: "https://vuhoangtelecom.vn/bo-phat-song-wifi/"
      wificomvn: "https://wifi.com.vn/router-wifi-bo-phat-wifi.html"
      # An Phát chia nhỏ hơn TNC: trang "bộ phát sóng không dây" (wifi gia đình/doanh nghiệp) +
      # trang riêng "router/bộ phát wifi 4G" — gộp cả hai để không bỏ sót router 4G.
      anphat:
        - "https://www.anphatpc.com.vn/bo-phat-song-khong-day_dm1109.html"
        - "https://www.anphatpc.com.vn/router-bo-phat-wifi-4g.html"
      # GearVN: "Router Wi-Fi" — trang danh mục thiết bị phát wifi thật (đã xác minh 2026-09, nằm
      # trong mục điều hướng "Phần mềm, mạng"). GearVN KHÔNG có switch/access point riêng biệt
      # nên chỉ router được thêm ở đây.
      gearvn: "https://gearvn.com/collections/thiet-bi-phat-wifi"
      # Memoryzone: "Router" (trang tổng thiết bị phát wifi — site cũng không có access point
      # riêng, giống GearVN).
      memoryzone: "https://memoryzone.com.vn/router-wifi"

  switch:
    tier: A
    search_term: "switch mạng"
    name_match: "switch|\\bhub\\b"
    name_exclude: "^laptop|kvm|usb hub|hub usb|hub type-c|bộ chia usb|converter"
    tnc: "https://www.tnc.com.vn/hub-switch.html?p={page}"
