    paths:
      phongvu: "https://phongvu.vn/search?router=productListing&query=wlan-controller"
      tgdd:    "https://www.thegioididong.com/tim-kiem?key=wlan+controller"
      fptshop: "https://fptshop.com.vn/tim-kiem?tab=kham-pha&s=wlan+controller&page={page}"

  pc:
    tier: A
    search_term: "pc"                          # "pc" cho nhiều match hơn "máy tính để bàn" trên các
                                               # site tìm-kiếm (HACOM/CellphoneS/Memoryzone: 0→2/2/1).
    # Tên PC của TNC luôn bắt đầu "Máy bộ ..."; không dùng khoảng trắng quanh "|" (sẽ thành literal).
    name_match: "máy bộ|may bo|máy tính để bàn|may tinh de ban|máy tính bộ|may tinh bo|\\bpc\\b"
    # Loại nhiễu: chỉ loại khi tên BẮT ĐẦU bằng loại phụ kiện (^) — PC nguyên bộ thường KÈM
    # "Bàn phím/Chuột" trong tên (MSI ... /Bàn phím/Chuột) nên không được match giữa chuỗi.
    # LOẠI máy build tự ráp của TNC ("PC TNC ...", "Máy bộ TNC ...", "Máy bộ TNC x Gigabyte ...") —
    # đây là hàng riêng của shop, không có ở đối thủ nên không bao giờ khớp; \btnc\b bắt mọi vị trí.
    name_exclude: "\\btnc\\b|^laptop|^màn hình|^man hinh|^bàn phím|^ban phim|^chuột|^chuot|^tai nghe|^loa |^webcam"
    tnc: "https://www.tnc.com.vn/pc-server.html?p={page}"   # TNC category page (all brands)
    # TODO: xác minh URL 3 site này QUA PROXY VN (chúng chặn IP ngoài VN — không kiểm tra trực tiếp
    # được). Nếu URL sai, scraper trả 0 cho site đó; sửa URL rồi chạy lại --dry để xác nhận.
    paths:                                         # category-path sites (no search box)
      # Phong Vũ: dùng endpoint tìm-kiếm `search?router=productListing&query=` — trang này CÓ
      # .att-product-detail-latest-price mà parser đọc được (khác /tim-kiem?q= vốn không có giá).
      phongvu: "https://phongvu.vn/c/may-tinh-de-ban"
      # TGĐĐ: slug /may-tinh-de-ban trần trả 0; dùng ô tìm-kiếm (tim-kiem?key=) → redirect về trang
      # danh mục CÓ product cards mà parser (li.item) đọc được.
      fptshop: "https://fptshop.com.vn/tim-kiem?s=may+tinh+de+ban&sort=noi-bat&categories=may-tinh-de-ban&page={page}"
      tgdd: "https://www.thegioididong.com/may-tinh-de-ban"
      phucanh: "https://www.phucanh.vn/may-tinh-de-ban.html"
      anphat: "https://www.anphatpc.com.vn/may-tinh-dong-bo.html"
      # Memoryzone: "PC Đồng Bộ" (/pc-dong-bo) — PC THƯƠNG HIỆU nguyên bộ (HP/Lenovo/Dell/Gigabyte),
      # khớp đúng nghĩa với TNC "Máy bộ ...". KHÔNG dùng "/pc-may-bo" (trang tổng lẫn cả Mini PC),
      # "/build-pc" hay "/pc-sieu-toc" (PC TỰ BUILD theo cấu hình CPU/VGA, không có mã model
      # thương hiệu — giống lý do KHÔNG thêm GearVN bên dưới, pc_sku() sẽ không khớp được).
      memoryzone: "https://memoryzone.com.vn/pc-dong-bo"
      # LƯU Ý: KHÔNG thêm GearVN ở đây. GearVN chỉ bán PC tự build theo cấu hình ("PC GVN" — đặt
      # tên theo CPU/VGA, không có mã model thương hiệu), khác hẳn PC thương hiệu (Dell/HP/Lenovo/
      # Asus nguyên bộ) mà TNC/pc.tnc bán. derive_sku() (pc_sku) sẽ không bao giờ khớp được hai bên
      # — thêm vào chỉ tạo rác trong missing_products, không tạo được khớp giá nào.
  # ── Máy trạm (Workstation) — branded (Dell Precision, HP Z, Lenovo ThinkStation) có mã model ──
  workstation:
    tier: A
    search_term: "workstation"
    name_match: "workstation|máy trạm|may tram|precision|thinkstation|\\bz[248]\\b"
    name_exclude: "^laptop|^màn hình|^man hinh|^bàn phím|^ban phim|^chuột|card màn hình|vga"
    tnc: "https://www.tnc.com.vn/may-tram-workstation.html?p={page}"
    paths:
      phongvu: "https://phongvu.vn/search?router=productListing&query=workstation"
      fptshop: "https://fptshop.com.vn/tim-kiem?s=workstation&page={page}"
      phucanh: "https://www.phucanh.vn/may-tram-workstation.html"
      anphat: "https://www.anphatpc.com.vn/may-tinh-workstation-may-tram_dm1469.html"
      # KHÔNG thêm Memoryzone: không bán máy trạm thương hiệu (Precision/ThinkStation/Z-series)
      # — không có trong menu điều hướng.

  # ── Máy chủ (Server) — branded (Dell PowerEdge, HPE ProLiant, Lenovo ThinkSystem) có mã model ──
  server:
    tier: A
    search_term: "server"
    name_match: "server|máy chủ|may chu|poweredge|proliant|thinksystem|primergy"
    name_exclude: "^laptop|^màn hình|^man hinh|ram server|ổ cứng server|nguồn server|cpu server|card"
    tnc: "https://www.tnc.com.vn/may-chu-server.html?p={page}"
    paths:
      phongvu: "https://phongvu.vn/c/may-chu-server"
      fptshop: "https://fptshop.com.vn/tim-kiem?s=server&page={page}"
      anphat: "https://www.anphatpc.com.vn/may-chu_dm1018.html"
      # KHÔNG thêm Memoryzone: chỉ bán LINH KIỆN gắn cho server/NAS (RAM Server, HDD Server) chứ
      # KHÔNG bán máy chủ thương hiệu nguyên bộ (PowerEdge/ProLiant/ThinkSystem) — không có trang
      # danh mục máy chủ thật để khớp.

  # ── Phần mềm bản quyền (Windows/Office, diệt virus, đồ họa...) — dùng software_sku ──
  # Không có mã part như phần cứng: định danh = tên sản phẩm + số thiết bị + thời hạn (Kaspersky
  # 3 thiết bị 1 năm ≠ 5 thiết bị 1 năm — giá khác nhau thật, xem software_sku trong sku.py).
  # Toàn bộ URL đối thủ dưới đây là CATEGORY PAGE thật (đã xác minh), không phải link tìm kiếm.
  software:
    tier: A
    search_term: "phần mềm bản quyền"
    name_match: "phần mềm|phan mem|bản quyền|ban quyen|diệt virus|diet virus|antivirus|\\boffice\\b|windows\\s*(10|11|server)?|kaspersky|bitdefender|\\beset\\b|norton|mcafee|bkav|adobe|winrar|\\bavg\\b|avast|autocad|vmware"
    name_exclude: "^laptop|^màn hình|^man hinh|chuột|chuot|bàn phím|ban phim|tai nghe|loa \\b|ổ cứng|o cung|ram\\b|ssd\\b|router|switch|webcam|usb\\b"
    tnc: "https://www.tnc.com.vn/phan-mem.html?p={page}"
    paths:
      phongvu:    "https://phongvu.vn/c/phan-mem"
      anphat:     "https://www.anphatpc.com.vn/phan-mem_dm401.html"
      gearvn:     "https://gearvn.com/collections/phan-mem"
      fptshop:    "https://fptshop.com.vn/phan-mem"
      memoryzone: "https://memoryzone.com.vn/phan-mem-ban-quyen"
      tgdd:       "https://www.thegioididong.com/phan-mem"
      cellphones: "https://cellphones.com.vn/phu-kien/may-tinh-laptop/phan-mem.html"
      hacom:      "https://hacom.vn/phan-mem-ban-quyen"

  # ── Camera an ninh (BRAND + model) ──
  camera:
    tier: A
    search_term: "camera ip"
    name_match: "camera|cam\\b"
    # Loại phụ kiện camera: đầu ghi, ổ cứng NAS/camera, thiết bị kiểm tra, cáp, nguồn POE
    name_exclude: "đầu ghi|dau ghi|nvr|dvr|ổ cứng|o cung|thiết bị kiểm tra|thiet bi kiem tra|poe|cáp|cap |nguồn|nguon|bracket|giá treo|gia treo|vỏ|vo camera|túi|tui"
    tnc: "https://www.tnc.com.vn/camera.html?p={page}"
    paths:
      phongvu: "https://phongvu.vn/c/camera-giam-sat"
      tgdd:    "https://www.thegioididong.com/camera-giam-sat"
      fptshop: "https://fptshop.com.vn/tim-kiem?s=camera&categories=camera&page={page}"
      phucanh: "https://www.phucanh.vn/camera-giam-sat.html"
      anphat:
        - "https://www.anphatpc.com.vn/camera_dm1216.html"
        - "https://www.anphatpc.com.vn/camera-quan-sat.html"
      # KHÔNG thêm Memoryzone: KHÔNG bán camera an ninh. Gợi ý tự động duy nhất khớp từ khóa
      # "camera" là https://memoryzone.com.vn/hdd-server-camera — đây là trang Ổ CỨNG chuyên
      # dùng cho đầu ghi camera (surveillance HDD), KHÔNG PHẢI trang bán thiết bị camera. Dùng
      # nhầm sẽ cào ra ổ cứng thay vì camera, sai hoàn toàn category.

  # ── Thiết bị âm thanh: tai nghe, loa, micro (BRAND + model) ──
  audio:
    tier: A
    search_term: "tai nghe loa"
    name_match: "tai nghe|tainghe|headphone|headset|earphone|\\bloa\\b|speaker|micro\\b|microphone"
    # Loại phụ kiện âm thanh: cáp audio, đầu chuyển, giá đỡ, bao đựng, amp/DAC riêng biệt
    name_exclude: "cáp|cap audio|cáp chia|cap chia|đầu chuyển|dau chuyen|giá đỡ|gia do|bao đựng|bao dung|đệm|dem tai|đệm mút|foam|amp\\b|\\bdac\\b|soundcard|sound card"
    tnc: "https://www.tnc.com.vn/thiet-bi-am-thanh.html?p={page}"
    paths:
      phongvu: "https://phongvu.vn/c/tai-nghe"
      tgdd:    "https://www.thegioididong.com/tai-nghe-nhung"
      phucanh: "https://www.phucanh.vn/tainghe.html"
      fptshop: "https://fptshop.com.vn/tai-nghe"
      anphat:
        - "https://www.anphatpc.com.vn/tai-nghe_dm1180.html"
        - "https://www.anphatpc.com.vn/loa.html"
      # GearVN: gộp CẢ BA trang danh mục — tai nghe, loa, microphone (đã xác minh 2026-09 qua
      # điều hướng chính "Loa, Micro, Webcam") — category `audio` của TNC cũng gộp cả ba loại
      # này (xem name_match ở trên: tai nghe|loa|micro), nên gộp tương tự phía GearVN cho khớp.
      gearvn:
        - "https://gearvn.com/collections/tai-nghe-may-tinh"
        - "https://gearvn.com/collections/loa"
        - "https://gearvn.com/collections/microphone"
      # Memoryzone: gộp "Tai Nghe" + "Loa" (đủ 2 trong 3 loại mà category `audio` bao phủ). KHÔNG
      # thêm "/microphone" riêng — kiểm tra nhanh không thấy card sản phẩm micro rời ổn định trong
      # menu (chỉ có microphone stream/gaming rải rác dưới các mục khác); bỏ qua để tránh
      # missing_products rác thay vì cào nhầm trang không đúng.
      memoryzone:
        - "https://memoryzone.com.vn/tai-nghe"
        - "https://memoryzone.com.vn/loa"