# Brand vocabulary — the human-editable source of truth for brand detection.
# Loaded by scraper/scraper/brand.py. `brand_of(name)` returns the canonical brand whose keyword
# matches (word-boundary), else falls back to structural extraction (the token after the category
# prefix), else "Other".
#
# To add/fix a brand: add a line below. Canonical name on the left; the keyword(s) that appear in
# product names on the right (lowercased). Multi-word brands ("E-Dra") and aliases ("macbook" for
# Apple) go in the list. Order matters only for tie-breaks (earlier wins), e.g. Lenovo before HP so
# "15AHP11" isn't read as HP.

brands:
  # ── computer makers (laptops, monitors, PCs) ──
  Lenovo:    [lenovo, thinkvision]
  Dell:      [dell, alienware]
  Asus:      [asus, rog, tuf]
  Acer:      [acer, predator, nitro]
  HP:        [hp, omen]
  Apple:     [apple, macbook, imac]
  MSI:       [msi]
  Gigabyte:  [gigabyte, aorus]

  # ── VGA / Mainboard makers ──
  # ASRock: trước đây brand_of("Mainboard ASROCK ...") rơi về "Mainboard" (không có từ khóa) → SKU rác.
  # Leadtek: "a4" (A4Tech) khớp bên trong mã "A400" → brand_of("Leadtek RTX A400") ra nhầm "A4Tech";
  # thêm Leadtek để nó khớp ngay ở đầu tên (ưu tiên vị trí sớm nhất).
  ASRock:    [asrock]
  Leadtek:   [leadtek]
  Inno3D:    [inno3d]
  Palit:     [palit]
  Zotac:     [zotac]
  Galax:     [galax]
  Gainward:  [gainward]
  Sapphire:  [sapphire]
  PowerColor: [powercolor, power color]
  Sparkle:   [sparkle]
  # NVIDIA cuối danh sách: chỉ dùng khi KHÔNG có hãng board (Leadtek/PNY…) đứng trước — card
  # "NVIDIA RTX PRO 6000" bán trần không có hãng board thì brand=NVIDIA (không để rơi về "VGA").
  NVIDIA:    [nvidia]

  # ── CPU (chỉ có 2 hãng: Intel và AMD) ──
  # Bắt cả tên DÒNG vì nhiều tên sản phẩm không ghi hãng: TNC ghi "CPU Athlon 3000G" (không có chữ
  # "AMD"), và "Core i5 14400" / "Ryzen 5 5600X" cũng thường đứng một mình.
  Intel:     [intel, celeron, pentium, xeon]
  AMD:       [amd, ryzen, athlon, threadripper, radeon]

  # ── Máy in / scan (printer, scanner) ──
  Epson:     [epson, ecotank]
  Canon:     [canon]
  Brother:   [brother]
  Pantum:    [pantum]
  Plustek:   [plustek]
  Fujitsu:   [fujitsu]

  # ── UPS (bộ lưu điện) ──
  Santak:      [santak]
  APC:         [apc]
  CyberPower:  [cyber power, cyberpower]
  ARES:        [ares]
  Eaton:       [eaton]
  Sorotec:     [sorotec]

  # ── Máy chiếu (projector) ──
  Panasonic:   [panasonic]
  Apollo:      [apollo]
  Wanbo:       [wanbo]
  Optoma:      [optoma]
  Boxlight:    [boxlight]

  # ── display makers (monitors, TVs) ──
  Samsung:       [samsung, odyssey, viewfinity]
  LG:            [lg, ultragear]
  ViewSonic:     [viewsonic]   # cũng làm máy chiếu
  TCL:           [tcl]         # tivi TCL — "Google Tivi TCL" phải ra TCL, không phải "Google"
  Casper:        [casper]
  Asanzo:        [asanzo]
  AOC:           [aoc]
  BenQ:          [benq, mobiuz]
  Philips:       [philips]
  Xiaomi:        [xiaomi, mi]
  E-Dra:         [e-dra, edra]
  HKC:           [hkc]
  Hikvision:     [hikvision]
  VSP:           [vsp]
  Cooler Master: [cooler master, coolermaster]

  # ── audio / peripherals / networking (add as categories are onboarded) ──
  Sony:      [sony, bravia]
  JBL:       [jbl]
  Logitech:  [logitech]
  Corsair:   [corsair]
  Kingston:  [kingston, hyperx, fury]

  # ── RAM / lưu trữ: các hãng còn thiếu khiến brand_of() rơi về tên danh mục ("Ram") và SKU bị hỏng.
  # Vd trước khi thêm: "Ram Desktop Kingmax 8GB DDR4 Bus 3200Mhz" → brand="Ram", sku="RAM-8GB-3200"
  # — SKU chỉ có spec nên MỌI RAM 8GB/3200 không rõ hãng đều gộp vào một khoá (lỗi trùng SKU).
  Kingmax:   [kingmax]
  Biwin:     [biwin]
  Synology:  [synology]
  Patriot:   [patriot, viper]
  PNY:       [pny]
  AGI:       [agi]
  Colorful:  [colorful]
  SSK:       [ssk]        # hãng box ổ cứng (HDD BOX SSK SHE-085)
  TP-Link:   [tp-link, tplink, "tp link", archer, omada, deco]
  D-Link:    [d-link, dlink]
  # ── thiết bị mạng (router / switch / access point / controller) ──
  Tenda:      [tenda]
  Totolink:   [totolink]
  Cisco:      [cisco, linksys]
  Ubiquiti:   [ubiquiti, unifi, ubnt]
  DrayTek:    [draytek, vigor]
