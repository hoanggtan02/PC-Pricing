  Grandstream: [grandstream]
  Mikrotik:   [mikrotik]
  Aruba:      [aruba]
  Mercusys:   [mercusys]
  Aptek:      [aptek]
  Cudy:       [cudy]
  H3C:        [h3c]
  Netgear:    [netgear, nighthawk]
  Zyxel:      [zyxel]
  Fortinet:   [fortinet, fortigate]
  Peplink:    [peplink, pepwave]
  # bàn phím / chuột / webcam
  Genius:    [genius]
  AULA:      [aula]
  Keychron:  [keychron]
  Razer:     [razer]
  Rapoo:     [rapoo]
  Microsoft: [microsoft]
  Dareu:     [dareu, "dare-u"]
  Fuhlen:    [fuhlen]
  Newmen:    [newmen]
  Leobog:    [leobog]
  Akko:      [akko]
  Leopold:   [leopold]
  Durgod:    [durgod]
  Steelseries: [steelseries, "steel series"]
  Lecoo:     [lecoo]          # thương hiệu phụ kiện giá rẻ của Lenovo
  Marvo:     [marvo]
  Motospeed: [motospeed]
  Zidli:     [zidli]
  Coolerplus: [coolerplus]
  Cliptec:   [cliptec]
  Baseus:    [baseus]
  MOFII:     [mofii]
  # HDD/SSD box & docking
  Orico:     [orico]
  Ugreen:    [ugreen]
  Unitek:    [unitek]

  # ── RAM / storage makers ──
  G.Skill:         [g.skill, gskill, "g skill", trident, ripjaws]
  Crucial:         [crucial, micron]
  ADATA:           [adata, xpg]
  TeamGroup:       [teamgroup, "team group", t-force, tforce]
  Lexar:           [lexar, ares]
  Apacer:          [apacer, nox]
  Western Digital: [western digital, wd, wds, sandisk]
  Seagate:         [seagate, barracuda, ironwolf]
  Kioxia:          [kioxia, exceria, toshiba]   # Kioxia = bộ nhớ Toshiba cũ; "Exceria" là dòng SSD/USB
  QNAP:            [qnap]
  Transcend:       [transcend]
  Netac:           [netac]
  # thêm phụ kiện (bàn phím/chuột/combo) phát hiện qua audit brand rác
  A4Tech:          [a4tech, "a4 tech", a4]
  R8:              [r8]
  Zadez:           [zadez]
  Mytechsun:       [mytechsun]
  Zalman:          [zalman]

# Category prefixes to strip before structural brand extraction (for names like
